<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | NEXUS </title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --brand: #6366f1; 
            --bg: #0f172a; 
            --card: #1e293b; 
            --accent: #334155; 
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg); 
            color: var(--text-main); 
            margin: 0; 
            overflow-x: hidden;
        }

        /* Modern Global Navigation */
        .global-nav { 
            background: rgba(15, 23, 42, 0.9); 
            backdrop-filter: blur(12px); 
            padding: 1.5rem; 
            display: flex; 
            justify-content: center; 
            gap: 3rem; 
            border-bottom: 1px solid var(--accent); 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
        }

        .global-nav a { 
            text-decoration: none; 
            color: var(--text-muted); 
            font-weight: 600; 
            transition: 0.3s; 
            font-size: 14px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }

        .global-nav a:hover { color: var(--brand); }

        /* Contact Section Layout */
        .auth-container {
            min-height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.08), transparent);
        }

        .contact-card { 
            background: var(--card); 
            padding: 50px; 
            border-radius: 30px; 
            width: 100%; 
            max-width: 500px; 
            border: 1px solid var(--accent);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
        }

        /* Decorative top glow */
        .contact-card::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            height: 20px;
            background: var(--brand);
            filter: blur(40px);
            opacity: 0.3;
        }

        h2 { 
            font-size: 2.2rem; 
            font-weight: 800; 
            margin: 0 0 10px 0;
            background: linear-gradient(to right, #fff, var(--brand)); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 35px;
            line-height: 1.5;
        }

        input, textarea { 
            width: 100%; 
            padding: 15px; 
            margin: 12px 0; 
            background: #0f172a; 
            border: 1px solid var(--accent); 
            border-radius: 12px; 
            color: white; 
            box-sizing: border-box; 
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--brand);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        textarea { resize: none; }

        .btn { 
            width: 100%; 
            padding: 16px; 
            background: var(--brand); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: 800; 
            font-size: 16px; 
            margin-top: 20px; 
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .btn:hover { 
            filter: brightness(1.2);
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.4);
        }

        footer {
            margin-top: 40px;
            font-size: 13px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <nav class="global-nav">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="services.html">Services</a>
        <a href="contact.html" style="color: var(--brand);">Contact Us</a>
    </nav>

    <div class="auth-container">
        <div class="contact-card">
            <h2>Connect with Nexus</h2>
            <p class="subtitle">Have technical inquiries or feedback regarding the Nexus Analytics Dashboard? Our support team is here to assist with your digital academic journey.</p>
            
            <input type="text" placeholder="Full Name">
            <input type="email" placeholder="Email Address">
            <textarea rows="5" placeholder="Your Message or Inquiry"></textarea>
            
            <button class="btn" onclick="alert('Message Transmitted Successfully')">Send Message</button>
            
            <footer>
                © 2026 Nexus Analytics | Driven by Digital Precision
            </footer>
        </div>
    </div>

</body>
</html>
