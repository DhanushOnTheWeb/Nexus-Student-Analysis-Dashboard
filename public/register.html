<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Registration | NEXUS </title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --brand: #6366f1; 
            --bg: #0f172a; 
            --card: #1e293b; 
            --accent: #334155; 
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg); 
            color: var(--text-main); 
            margin: 0; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Global Navigation (Matches Shared Theme) */
        .global-nav { 
            background: rgba(15, 23, 42, 0.9); 
            backdrop-filter: blur(10px); 
            padding: 1.5rem; 
            display: flex; 
            justify-content: center; 
            gap: 3rem; 
            border-bottom: 1px solid var(--accent); 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
        }

        .global-nav a { 
            text-decoration: none; 
            color: var(--text-muted); 
            font-weight: 600; 
            transition: 0.3s; 
            font-size: 14px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }

        .global-nav a:hover { color: var(--brand); }

        /* Registration Card Layout */
        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: radial-gradient(circle at center, rgba(99, 102, 241, 0.05), transparent);
        }

        .register-card { 
            background: var(--card); 
            padding: 50px; 
            border-radius: 30px; 
            width: 100%; 
            max-width: 420px; 
            border: 1px solid var(--accent);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
        }

        /* Decorative glow accent */
        .register-card::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 20px;
            background: var(--brand);
            filter: blur(40px);
            opacity: 0.3;
        }

        h2 { 
            font-size: 2rem; 
            font-weight: 800; 
            margin-bottom: 10px; 
            background: linear-gradient(to right, #fff, var(--brand)); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
        }

        input { 
            width: 100%; 
            padding: 14px; 
            margin: 10px 0; 
            background: #0f172a; 
            border: 1px solid var(--accent); 
            border-radius: 12px; 
            color: white; 
            box-sizing: border-box; 
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--brand);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        button { 
            width: 100%; 
            padding: 16px; 
            background: var(--brand); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: 800; 
            font-size: 16px; 
            margin-top: 20px; 
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        button:hover { 
            filter: brightness(1.2);
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.4);
        }

        .login-link { 
            margin-top: 25px; 
            font-size: 14px; 
            color: var(--text-muted);
        }

        .login-link a { 
            color: var(--brand); 
            text-decoration: none; 
            font-weight: 700; 
        }

        .login-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <nav class="global-nav">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact Us</a>
    </nav>

    <div class="auth-container">
        <div class="register-card">
            <h2>Faculty Registration</h2>
            <p class="subtitle">Create an account to manage academic records for New Horizon College.</p>
            
            <input type="text" id="name" placeholder="Full Name">
            <input type="text" id="uid" placeholder="Teacher Unique ID">
            <input type="password" id="psw" placeholder="Password">
            
            <button onclick="handleRegister()">Complete Registration</button>
            
            <div class="login-link">
                Already registered? <a href="teachers.html">Sign In Here</a>
            </div>
        </div>
    </div>

    <script>
        async function handleRegister() {
            const name = document.getElementById('name').value;
            const uniqueId = document.getElementById('uid').value;
            const password = document.getElementById('psw').value;

            if (!name || !uniqueId || !password) {
                return alert("⚠️ Please provide all required information.");
            }

            try {
                const res = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, uniqueId, password, role: 'teacher' })
                });

                const data = await res.json();

                if (res.ok) {
                    alert("✅ " + data.message);
                    window.location.href = 'teachers.html'; 
                } else {
                    alert("❌ " + data.error);
                }
            } catch (err) {
                alert("⚠️ Connection error. Ensure server.js is running.");
            }
        }
    </script>
</body>
</html>
