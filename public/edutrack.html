<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTrack Feed | NEXUS Academic Broadcast</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --brand: #6366f1;
            --brand-glow: rgba(99, 102, 241, 0.35);
            --bg: #0b0f19;
            --card: #151d30;
            --accent: #27354f;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --tag-assign: rgba(99, 102, 241, 0.2);
            --tag-exam: rgba(16, 185, 129, 0.2);
            --tag-test: rgba(245, 158, 11, 0.2);
            --tag-holiday: rgba(239, 68, 68, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 60px;
            background-image: radial-gradient(circle at top right, rgba(99, 102, 241, 0.1), transparent 45%);
        }

        /* Modern Global Navigation */
        .global-nav {
            background: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(14px);
            padding: 1.1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-brand {
            font-weight: 800;
            font-size: 1.25rem;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-brand span {
            color: var(--brand);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 13.5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.25s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--brand);
        }

        .container {
            max-width: 850px;
            margin: 50px auto;
            padding: 0 20px;
        }

        header {
            text-align: center;
            margin-bottom: 45px;
        }

        header h1 {
            font-size: clamp(2.2rem, 5vw, 3.2rem);
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff 40%, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        /* Academic Card Styling */
        .card {
            background: var(--card);
            padding: 32px;
            border-radius: 24px;
            margin-bottom: 22px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(99, 102, 241, 0.4);
        }

        .card-header-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tag {
            font-size: 11px;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
        }

        .tag-Assignment {
            background: var(--tag-assign);
            color: #818cf8;
            border: 1px solid rgba(129, 140, 248, 0.3);
        }

        .tag-Exam {
            background: var(--tag-exam);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.3);
        }

        .tag-ClassTest {
            background: var(--tag-test);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        .tag-Holiday {
            background: var(--tag-holiday);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.3);
        }

        .dept-badge {
            font-size: 11.5px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 6px;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 0 12px 0;
            color: #fff;
        }

        .meta-info {
            color: var(--text-muted);
            font-size: 13.5px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .due-badge {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 700;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .file-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(99, 102, 241, 0.12);
            color: var(--brand);
            padding: 12px 22px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 13.5px;
            transition: 0.25s;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .file-link:hover {
            background: var(--brand);
            color: white;
            box-shadow: 0 8px 20px var(--brand-glow);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--card);
            border-radius: 24px;
            border: 1px solid var(--accent);
            color: var(--text-muted);
        }
    </style>
</head>

<body>

    <nav class="global-nav">
        <a href="index.html" class="nav-brand">
            ⚡ NEXUS<span>.FEED</span>
        </a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="student.html">Student Gateway</a>
            <a href="teachers.html">Faculty Portal</a>
            <a href="edutrack.html" class="active">EduTrack</a>
        </div>
    </nav>

    <div class="container">
        <header>
            <h1>Academic Intelligence Feed</h1>
            <p>Live departmental broadcasts, assignments, and test circulars.</p>
        </header>

        <div id="feed">
            <div style="text-align:center; padding:50px; color:var(--text-muted);">
                Connecting to Academic Intelligence Feed...
            </div>
        </div>
    </div>

    <script>
        async function load() {
            try {
                const res = await fetch('/api/edutrack');
                const data = await res.json();
                const feed = document.getElementById('feed');
                feed.innerHTML = '';

                if (data.length === 0) {
                    feed.innerHTML = `
                        <div class="empty-state">
                            <span style="font-size: 40px; display: block; margin-bottom: 12px;">📭</span>
                            <h3>No Broadcasts Currently Available</h3>
                            <p style="margin-top: 6px; font-size: 14px;">Institutional notices and coursework files will appear here once posted by faculty.</p>
                        </div>`;
                    return;
                }

                data.forEach(i => {
                    const cleanType = (i.type || 'Notice').replace(/\s+/g, '');
                    const deptInfo = (i.degree && i.semester) ? `${i.degree} • Semester ${i.semester}` : '';

                    feed.innerHTML += `
                        <div class="card">
                            <div class="card-header-line">
                                <span class="tag tag-${cleanType}">${i.type}</span>
                                ${deptInfo ? `<span class="dept-badge">${deptInfo}</span>` : ''}
                            </div>
                            <h2>${i.title}</h2>
                            <div class="meta-info">
                                <span>📅 Published: ${i.postDate || 'Recent'}</span>
                                ${i.subject ? `<span>📚 Module: <b>${i.subject}</b></span>` : ''}
                                ${i.submissionDate ? `<span class="due-badge">🚨 Deadline: ${i.submissionDate}</span>` : ''}
                            </div>
                            ${i.filePath ? `
                                <a href="${i.filePath}" target="_blank" download class="file-link">
                                    📂 Download ${i.fileName || 'Attachment'}
                                </a>` : ''}
                        </div>`;
                });
            } catch (error) {
                document.getElementById('feed').innerHTML = `
                    <div class="empty-state">
                        <span style="font-size: 40px; display: block; margin-bottom: 12px;">⚠️</span>
                        <h3>Unable to connect to Nexus Server</h3>
                        <p style="margin-top: 6px;">Please verify your network connection or server status.</p>
                    </div>`;
            }
        }
        load();
    </script>
</body>

</html>
